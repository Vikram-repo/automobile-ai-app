apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: automobile-ai-agent
  namespace: automobile-ai

  labels:
    app: automobile-ai-agent

spec:

  replicas: 2

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: automobile-ai-agent

  strategy:

    blueGreen:

      # Production traffic
      activeService: automobile-ai-agent

      # New version / preview traffic
      previewService: automobile-ai-agent-preview

      # Don't automatically send production traffic
      # to the new version.
      autoPromotionEnabled: false

      # Keep old version alive for a short period
      # after promotion.
      scaleDownDelaySeconds: 30

  template:

    metadata:
      labels:
        app: automobile-ai-agent
        azure.workload.identity/use: "true"

    spec:

      serviceAccountName: automobile-agent-sa

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:

        - name: automobile-ai-agent

          image: zautomoilesappregisty.azurecr.io/automobile-ai-agent:1.0.4

          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: automobile-ai-secrets

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          readinessProbe:

            httpGet:
              path: /
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          terminationMessagePolicy: File

          volumeMounts:

            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:

        - name: secrets-store

          csi:
            driver: secrets-store.csi.k8s.io

            readOnly: true

            volumeAttributes:
              secretProviderClass: automobile-agent-secrets