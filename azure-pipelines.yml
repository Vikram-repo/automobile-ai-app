trigger: none

pr:
  branches:
    include:
      - main

pool: z_automobile_app

variables:
  pythonVersion: '3.12'
  imageRepository: 'automobile-ai-agent'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

stages:

# ============================================================
# CI
# ============================================================

- stage: CI
  displayName: 'CI - Build, Test and Scan'

  jobs:

  - job: Build
    displayName: 'Build, Test and Push'

    steps:

    # --------------------------------------------------------
    # Python dependencies
    # --------------------------------------------------------

    - script: |
        python3 --version
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt
      displayName: 'Create venv and install dependencies'


    # --------------------------------------------------------
    # Tests
    # --------------------------------------------------------

    # TODO:
    # - Unit tests
    # - API integration tests
    # - Agent integration tests


    # --------------------------------------------------------
    # Docker Build
    # --------------------------------------------------------

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        containerRegistry: 'ado-acr'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(imageTag)


    # --------------------------------------------------------
    # Verify Docker image
    # --------------------------------------------------------

    - script: |
        echo "Docker images on agent:"
        docker images
      displayName: 'Verify Docker image'


    # --------------------------------------------------------
    # Trivy Image Security Scan
    # --------------------------------------------------------

    # Temporarily skipped

    # - task: Bash@3
    #   displayName: 'Trivy image security scan'
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       trivy image \
    #         --severity HIGH,CRITICAL \
    #         --exit-code 1 \
    #         $(imageRepository):$(imageTag)


    # --------------------------------------------------------
    # Push image to ACR
    # --------------------------------------------------------

    - task: Docker@2
      displayName: 'Push image to ACR'
      inputs:
        containerRegistry: 'ado-acr'
        repository: '$(imageRepository)'
        command: 'push'
        tags: |
          $(imageTag)


