# ============================================================
# CD - ARGO ROLLOUTS BLUE GREEN
# ============================================================

- stage: CD

  displayName: 'CD - Argo Rollouts Blue Green'

  condition: succeeded()

  jobs:

  - deployment: ArgoBlueGreenDeployment

    displayName: 'Deploy to AKS using Argo Rollouts'

    environment: 'automobile-ai-dev'

    pool: z_automobile_app

    strategy:

      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # Checkout
          # --------------------------------------------------

          - checkout: self

            displayName: 'Checkout Kubernetes manifests'


          # --------------------------------------------------
          # Verify AKS
          # --------------------------------------------------

          - script: |

              set -e

              kubectl version --client

              kubectl get nodes

            displayName: 'Verify AKS access'


          # --------------------------------------------------
          # Verify Argo Rollouts
          # --------------------------------------------------

          - script: |

              set -e

              echo "Argo Rollouts CRD:"
              kubectl get crd rollouts.argoproj.io

              echo ""

              echo "Argo Rollouts Controller:"
              kubectl get pods \
                -n argo-rollouts

              echo ""

              echo "Argo Rollouts CLI:"
              kubectl argo rollouts version

            displayName: 'Verify Argo Rollouts'


          # --------------------------------------------------
          # Apply Kubernetes resources
          # --------------------------------------------------

          - script: |

              set -e

              kubectl apply \
                -f k8s/serviceaccount.yaml

              kubectl apply \
                -f k8s/secret-provider-class.yaml

              kubectl apply \
                -f k8s/active-service.yaml

              kubectl apply \
                -f k8s/preview-service.yaml

              kubectl apply \
                -f k8s/rollout.yaml

            displayName: 'Deploy Argo Rollout'


          # --------------------------------------------------
          # Verify Rollout exists
          # --------------------------------------------------

          - script: |

              set -e

              kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Verify Rollout'


          # --------------------------------------------------
          # Update image
          # --------------------------------------------------

          - script: |

              set -e

              IMAGE="zautomoilesappregisty.azurecr.io/automobile-ai-agent:$(imageTag)"

              echo "Deploying image:"
              echo "$IMAGE"

              kubectl argo rollouts set image \
                automobile-ai-agent \
                automobile-ai-agent="$IMAGE" \
                -n automobile-ai

            displayName: 'Update Rollout image'


          # --------------------------------------------------
          # Wait for Preview Pods
          # --------------------------------------------------

          - script: |

              set -e

              echo "Waiting for Preview pods to become Ready..."

              for i in {1..60}; do

                READY=$(kubectl get pods \
                  -n automobile-ai \
                  -l app=automobile-ai-agent \
                  -o jsonpath='{range .items[*]}{.status.containerStatuses[0].ready}{"\n"}{end}' \
                  2>/dev/null | grep -c '^true$' || true)

                echo "Ready containers: $READY"

                if [ "$READY" -ge 2 ]; then
                  echo "Preview pods are Ready."
                  break
                fi

                sleep 5

              done

              if [ "$READY" -lt 2 ]; then

                echo "Preview pods did not become Ready."

                kubectl get pods \
                  -n automobile-ai \
                  -l app=automobile-ai-agent \
                  -o wide

                exit 1

              fi

            displayName: 'Wait for Preview pods'


          # --------------------------------------------------
          # Show Blue Green state
          # --------------------------------------------------

          - script: |

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              kubectl get pods \
                -n automobile-ai \
                -l app=automobile-ai-agent \
                -o wide

            displayName: 'Verify Blue Green state'
# --------------------------------------------------
# Preview smoke test
# --------------------------------------------------

          - script: |

              set -e

              POD="automobile-ai-preview-test"
              NAMESPACE="automobile-ai"

              echo "Running Preview smoke test..."

              kubectl delete pod "$POD" \
                -n "$NAMESPACE" \
                --ignore-not-found=true

              kubectl run "$POD" \
                -n "$NAMESPACE" \
                --restart=Never \
                --image=curlimages/curl:8.10.1 \
                --command \
                -- sh -c '
                  echo "Testing Preview Service..."

                  for i in $(seq 1 10); do

                    echo "Attempt $i"

                    if curl \
                      --fail \
                      --silent \
                      --show-error \
                      --max-time 10 \
                      http://automobile-ai-agent-preview:8000/; then

                      echo "Preview smoke test PASSED"
                      exit 0

                    fi

                    sleep 3

                  done

                  echo "Preview smoke test FAILED"
                  exit 1
                '

              echo "Waiting for smoke-test pod..."

              if kubectl wait \
                --for=jsonpath='{.status.phase}'=Succeeded \
                pod/"$POD" \
                -n "$NAMESPACE" \
                --timeout=120s; then

                echo "Smoke test pod succeeded."

                kubectl logs \
                  "$POD" \
                  -n "$NAMESPACE"

              else

                echo "Smoke test pod did not succeed."

                echo "========== POD STATUS =========="

                kubectl get pod "$POD" \
                  -n "$NAMESPACE" \
                  -o wide

                echo "========== POD DESCRIPTION =========="

                kubectl describe pod "$POD" \
                  -n "$NAMESPACE"

                echo "========== POD LOGS =========="

                kubectl logs \
                  "$POD" \
                  -n "$NAMESPACE" \
                  --all-containers=true \
                  || true

                exit 1

              fi

              kubectl delete pod "$POD" \
                -n "$NAMESPACE" \
                --ignore-not-found=true

            displayName: 'Smoke test Preview'

          # --------------------------------------------------
          # Wait for promotion
          # --------------------------------------------------

          - script: |

              set -e

              kubectl argo rollouts status \
                automobile-ai-agent \
                -n automobile-ai \
                --timeout 300s

            displayName: 'Wait for promotion completion'


          # --------------------------------------------------
          # Final verification
          # --------------------------------------------------

          - script: |

              set -e

              echo "========== FINAL ROLLOUT =========="

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              echo "========== SERVICES =========="

              kubectl get svc \
                -n automobile-ai

              echo ""

              echo "========== PODS =========="

              kubectl get pods \
                -n automobile-ai \
                -l app=automobile-ai-agent \
                -o wide

              echo ""

              echo "========== ACTIVE SERVICE =========="

              kubectl get service \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.spec.selector}'

              echo ""

              echo "Blue-Green deployment completed successfully."

            displayName: 'Final deployment verification'