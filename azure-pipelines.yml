# ============================================================
# CD - ARGO ROLLOUTS BLUE GREEN
# ============================================================

- stage: CD

  displayName: 'CD - Argo Rollouts Blue Green'

  dependsOn: CI

  condition: succeeded()

  jobs:

  - deployment: ArgoBlueGreenDeployment

    displayName: 'Deploy to AKS using Argo Rollouts'

    environment: 'automobile-ai-dev'

    pool: z_automobile_app

    strategy:

      runOnce:

        deploy:

          steps:

          # --------------------------------------------------
          # Checkout
          # --------------------------------------------------

          - checkout: self

            displayName: 'Checkout Kubernetes manifests'


          # --------------------------------------------------
          # Verify AKS
          # --------------------------------------------------

          - script: |

              kubectl version --client

              kubectl get nodes

            displayName: 'Verify AKS access'


          # --------------------------------------------------
          # Verify Argo Rollouts Controller
          # --------------------------------------------------

          - script: |

              kubectl get crd rollouts.argoproj.io

              kubectl get pods \
                -n argo-rollouts

              kubectl argo rollouts version

            displayName: 'Verify Argo Rollouts'


          # --------------------------------------------------
          # Apply Kubernetes resources
          # --------------------------------------------------

          - script: |

              kubectl apply \
                -f k8s/serviceaccount.yaml

              kubectl apply \
                -f k8s/secret-provider-class.yaml

              kubectl apply \
                -f k8s/active-service.yaml

              kubectl apply \
                -f k8s/preview-service.yaml

              kubectl apply \
                -f k8s/rollout.yaml

            displayName: 'Deploy Argo Rollout'


          # --------------------------------------------------
          # Verify Rollout
          # --------------------------------------------------

          - script: |

              kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Verify Rollout'


          # --------------------------------------------------
          # Update Rollout image
          # --------------------------------------------------

          - script: |

              echo "Deploying image:"
              echo "zautomoilesappregisty.azurecr.io/automobile-ai-agent:$(imageTag)"

              kubectl argo rollouts set image \
                automobile-ai-agent \
                automobile-ai-agent=zautomoilesappregisty.azurecr.io/automobile-ai-agent:$(imageTag) \
                -n automobile-ai

            displayName: 'Update Rollout image'


          # --------------------------------------------------
          # Wait for Preview
          # --------------------------------------------------

          - script: |

              kubectl argo rollouts status \
                automobile-ai-agent \
                -n automobile-ai \
                --timeout 300

            displayName: 'Wait for rollout'


          # --------------------------------------------------
          # Show Rollout
          # --------------------------------------------------

          - script: |

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Verify Preview deployment'


          # --------------------------------------------------
          # Promote
          # --------------------------------------------------

          - script: |

              kubectl argo rollouts promote \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Promote new version'


          # --------------------------------------------------
          # Final verification
          # --------------------------------------------------

          - script: |

              kubectl argo rollouts status \
                automobile-ai-agent \
                -n automobile-ai \
                --timeout 300

              echo ""

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              kubectl get pods \
                -n automobile-ai \
                -l app=automobile-ai-agent \
                -o wide

            displayName: 'Final rollout verification'