trigger: none

pr:
  branches:
    include:
      - main

pool: z_automobile_app

variables:
  pythonVersion: '3.12'
  imageRepository: 'automobile-ai-agent'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'



# ============================================================
# CI
# ============================================================
stages:
- stage: CI
  displayName: 'CI - Build, Test and Scan'

  jobs:

  - job: Build
    displayName: 'Build, Test and Push'

    steps:

    # --------------------------------------------------------
    # Python dependencies
    # --------------------------------------------------------

    - script: |
        python3 --version
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt
      displayName: 'Create venv and install dependencies'


#     # --------------------------------------------------------
#     # Tests
#     # --------------------------------------------------------

#     # TODO:
#     # - Unit tests
#     # - API integration tests
#     # - Agent integration tests


#     # --------------------------------------------------------
#     # Docker Build
#     # --------------------------------------------------------

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        containerRegistry: 'ado-acr'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(imageTag)


#     # --------------------------------------------------------
#     # Verify Docker image
#     # --------------------------------------------------------

    - script: |
        echo "Docker images on agent:"
        docker images
      displayName: 'Verify Docker image'


#     # --------------------------------------------------------
#     # Trivy Image Security Scan
#     # --------------------------------------------------------

#     # Temporarily skipped

#     # - task: Bash@3
#     #   displayName: 'Trivy image security scan'
#     #   inputs:
#     #     targetType: 'inline'
#     #     script: |
#     #       trivy image \
#     #         --severity HIGH,CRITICAL \
#     #         --exit-code 1 \
#     #         $(imageRepository):$(imageTag)


#     # --------------------------------------------------------
#     # Push image to ACR
#     # --------------------------------------------------------

    - task: Docker@2
      displayName: 'Push image to ACR'
      inputs:
        containerRegistry: 'ado-acr'
        repository: '$(imageRepository)'
        command: 'push'
        tags: |
          $(imageTag)


# ============================================================
# CD - ARGO ROLLOUTS BLUE GREEN
# ============================================================

- stage: CD

  displayName: 'CD - Argo Rollouts Blue Green'

  # dependsOn: CI

  # condition: succeeded()

  jobs:

  - deployment: ArgoBlueGreenDeployment

    displayName: 'Deploy to AKS using Argo Rollouts'

    environment: 'automobile-ai-dev'

    pool: z_automobile_app

    strategy:

      runOnce:

        deploy:

          steps:

          # ==================================================
          # Checkout
          # ==================================================

          - checkout: self

            displayName: 'Checkout Kubernetes manifests'


          # ==================================================
          # Verify AKS + Argo Rollouts
          # ==================================================

          - script: |

              set -e

              kubectl version --client

              kubectl get nodes

              kubectl get crd rollouts.argoproj.io

              kubectl get pods -n argo-rollouts

              kubectl argo rollouts version

            displayName: 'Verify AKS and Argo Rollouts'


          # ==================================================
          # Apply Kubernetes Resources
          # ==================================================

          - script: |

              set -e

              kubectl apply \
                -f k8s/serviceaccount.yaml

              kubectl apply \
                -f k8s/secret-provider-class.yaml

              kubectl apply \
                -f k8s/active-service.yaml

              kubectl apply \
                -f k8s/preview-service.yaml

              kubectl apply \
                -f k8s/rollout.yaml

            displayName: 'Apply Kubernetes resources'


          # ==================================================
          # Verify Rollout
          # ==================================================

          - script: |

              set -e

              kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Verify Rollout'


          # ==================================================
          # Deploy New Image
          # ==================================================

          - script: |

              set -e

              IMAGE="zautomoilesappregisty.azurecr.io/automobile-ai-agent:$(imageTag)"

              echo "Deploying image:"
              echo "$IMAGE"

              kubectl argo rollouts set image \
                automobile-ai-agent \
                automobile-ai-agent="$IMAGE" \
                -n automobile-ai

            displayName: 'Deploy new image'


# ============================================================
# Verify Preview
# ============================================================

          - script: |

              set -e

              echo "========== ROLLOUT =========="

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              echo "========== ROLLOUT YAML STATUS =========="

              kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai \
                -o yaml

              echo ""

              echo "========== ALL PODS =========="

              kubectl get pods \
                -n automobile-ai \
                -l app=automobile-ai-agent \
                -o wide

              echo ""

              echo "========== PREVIEW SERVICE =========="

              kubectl get svc \
                automobile-ai-agent-preview \
                -n automobile-ai \
                -o yaml

              echo ""

              echo "========== PREVIEW ENDPOINTS =========="

              kubectl get endpoints \
                automobile-ai-agent-preview \
                -n automobile-ai \
                -o wide

              echo ""

              echo "========== REPLICASETS =========="

              kubectl get rs \
                -n automobile-ai \
                -l app=automobile-ai-agent \
                -o wide

              echo ""

              echo "========== ROLLOUT EVENTS =========="

              kubectl describe rollout \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Debug Preview'

          # ==================================================
          # Preview Smoke Test
          # ==================================================

          - script: |

              set -e

              POD="automobile-ai-preview-test"
              NAMESPACE="automobile-ai"

              echo "Running Preview smoke test..."

              kubectl delete pod "$POD" \
                -n "$NAMESPACE" \
                --ignore-not-found=true

              kubectl run "$POD" \
                -n "$NAMESPACE" \
                --restart=Never \
                --image=curlimages/curl:8.10.1 \
                --command \
                -- sh -c '
                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --max-time 15 \
                    http://automobile-ai-agent-preview:8000/
                '

              if kubectl wait \
                --for=jsonpath='{.status.phase}'=Succeeded \
                pod/"$POD" \
                -n "$NAMESPACE" \
                --timeout=60s; then

                echo "Preview smoke test PASSED"

              else

                echo "Preview smoke test FAILED"

                kubectl get pod "$POD" \
                  -n "$NAMESPACE" \
                  -o wide

                echo ""

                kubectl logs \
                  "$POD" \
                  -n "$NAMESPACE" \
                  || true

                kubectl describe pod \
                  "$POD" \
                  -n "$NAMESPACE" \
                  || true

                exit 1

              fi

              kubectl delete pod "$POD" \
                -n "$NAMESPACE" \
                --ignore-not-found=true

            displayName: 'Smoke test Preview'


          # ==================================================
          # Promote Preview -> Active
          # ==================================================

          - script: |

              set -e

              echo "Promoting Preview to Active..."

              kubectl argo rollouts promote \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Promote Preview to Active'


          # ==================================================
          # Wait for Promotion
          # ==================================================

          - script: |

              set -e

              kubectl argo rollouts status \
                automobile-ai-agent \
                -n automobile-ai \
                --timeout 300s

            displayName: 'Verify Promotion'


          # ==================================================
          # Final Verification
          # ==================================================

          - script: |

              set -e

              echo "=========================================="
              echo "FINAL ROLLOUT"
              echo "=========================================="

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              echo "=========================================="
              echo "SERVICES"
              echo "=========================================="

              kubectl get svc \
                -n automobile-ai

              echo ""

              echo "=========================================="
              echo "PODS"
              echo "=========================================="

              kubectl get pods \
                -n automobile-ai \
                -l app=automobile-ai-agent \
                -o wide

              echo ""

              echo "=========================================="
              echo "ACTIVE SERVICE SELECTOR"
              echo "=========================================="

              kubectl get service \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.spec.selector}'

              echo ""

              echo ""

              echo "Blue-Green deployment completed successfully."

            displayName: 'Final deployment verification'