
trigger: none

pr:
  branches:
    include:
      - main

pool: z_automobile_app

variables:
  pythonVersion: '3.12'
  imageRepository: 'automobile-ai-agent'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'



# ============================================================
# CI
# ============================================================
stages:
- stage: CI
  displayName: 'CI - Build, Test and Scan'

  jobs:

  - job: Build
    displayName: 'Build, Test and Push'

    steps:

    # --------------------------------------------------------
    # Python dependencies
    # --------------------------------------------------------

    - script: |
        python3 --version
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt
      displayName: 'Create venv and install dependencies'


#     # --------------------------------------------------------
#     # Tests
#     # --------------------------------------------------------

#     # TODO:
#     # - Unit tests
#     # - API integration tests
#     # - Agent integration tests


#     # --------------------------------------------------------
#     # Docker Build
#     # --------------------------------------------------------

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        containerRegistry: 'ado-acr'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(imageTag)


#     # --------------------------------------------------------
#     # Verify Docker image
#     # --------------------------------------------------------

    - script: |
        echo "Docker images on agent:"
        docker images
      displayName: 'Verify Docker image'


#     # --------------------------------------------------------
#     # Trivy Image Security Scan
#     # --------------------------------------------------------

#     # Temporarily skipped

#     # - task: Bash@3
#     #   displayName: 'Trivy image security scan'
#     #   inputs:
#     #     targetType: 'inline'
#     #     script: |
#     #       trivy image \
#     #         --severity HIGH,CRITICAL \
#     #         --exit-code 1 \
#     #         $(imageRepository):$(imageTag)


#     # --------------------------------------------------------
#     # Push image to ACR
#     # --------------------------------------------------------

    - task: Docker@2
      displayName: 'Push image to ACR'
      inputs:
        containerRegistry: 'ado-acr'
        repository: '$(imageRepository)'
        command: 'push'
        tags: |
          $(imageTag)


- stage: CD

  displayName: 'CD - Argo Rollouts Blue Green'

  dependsOn: CI
  condition: succeeded()

  jobs:

  - deployment: ArgoBlueGreenDeployment

    displayName: 'Deploy to AKS using Argo Rollouts'

    environment: 'automobile-ai-dev'

    pool: z_automobile_app

    strategy:

      runOnce:

        deploy:

          steps:

          # ==================================================
          # CHECKOUT
          # ==================================================

          - checkout: self

            displayName: 'Checkout Kubernetes manifests'


          # ==================================================
          # VERIFY AKS + ARGO ROLLOUTS
          # ==================================================

          - script: |

              set -e

              kubectl version --client
              kubectl get nodes

              kubectl get crd rollouts.argoproj.io

              kubectl get pods -n argo-rollouts

              kubectl argo rollouts version

            displayName: 'Verify AKS and Argo Rollouts'


          # ==================================================
          # APPLY KUBERNETES RESOURCES
          # ==================================================

          - script: |

              set -e

              kubectl apply -f k8s/serviceaccount.yaml

              kubectl apply -f k8s/secret-provider-class.yaml

              kubectl apply -f k8s/active-service.yaml

              kubectl apply -f k8s/preview-service.yaml

              kubectl apply -f k8s/rollout.yaml

            displayName: 'Apply Kubernetes resources'


          # ==================================================
          # VERIFY ROLLOUT
          # ==================================================

          - script: |

              set -e

              kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai

            displayName: 'Verify Rollout'


          # ==================================================
          # DEPLOY NEW IMAGE
          # ==================================================

          - script: |

              set -e

              IMAGE="zautomoilesappregisty.azurecr.io/automobile-ai-agent:$(imageTag)"

              echo "=========================================="
              echo "Deploying image:"
              echo "$IMAGE"
              echo "=========================================="

              kubectl argo rollouts set image \
                automobile-ai-agent \
                automobile-ai-agent="$IMAGE" \
                -n automobile-ai

            displayName: 'Deploy new image'


          # ==================================================
          # WAIT FOR PREVIEW
          # ==================================================

          - script: |

              set -e

              echo "Waiting for Preview ReplicaSet..."

              for i in {1..60}; do

                PREVIEW_SELECTOR=$(kubectl get rollout \
                  automobile-ai-agent \
                  -n automobile-ai \
                  -o jsonpath='{.status.blueGreen.previewSelector}')

                if [ -n "$PREVIEW_SELECTOR" ]; then
                  echo "Preview selector: $PREVIEW_SELECTOR"
                  break
                fi

                echo "Preview selector not available yet..."
                sleep 5

              done

              if [ -z "$PREVIEW_SELECTOR" ]; then
                echo "ERROR: Preview selector was not created."
                exit 1
              fi

              echo ""
              echo "Waiting for Preview pods..."

              for i in {1..60}; do

                READY=$(kubectl get pods \
                  -n automobile-ai \
                  -l rollouts-pod-template-hash="$PREVIEW_SELECTOR" \
                  -o jsonpath='{range .items[*]}{.status.containerStatuses[0].ready}{"\n"}{end}' \
                  2>/dev/null \
                  | grep -c '^true$' || true)

                echo "Ready Preview pods: $READY"

                if [ "$READY" -ge 2 ]; then
                  echo "Preview pods are Ready."
                  break
                fi

                sleep 5

              done

              if [ "$READY" -lt 2 ]; then

                echo "ERROR: Preview pods did not become Ready."

                kubectl get pods \
                  -n automobile-ai \
                  -l rollouts-pod-template-hash="$PREVIEW_SELECTOR" \
                  -o wide

                exit 1

              fi

            displayName: 'Wait for Preview'


          # ==================================================
          # DEBUG PREVIEW
          # ==================================================

          - script: |

              set -e

              echo "========== ROLLOUT =========="

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              echo "========== PREVIEW SELECTOR =========="

              kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.status.blueGreen.previewSelector}{"\n"}'

              echo ""

              echo "========== PREVIEW PODS =========="

              PREVIEW_SELECTOR=$(kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.status.blueGreen.previewSelector}')

              kubectl get pods \
                -n automobile-ai \
                -l rollouts-pod-template-hash="$PREVIEW_SELECTOR" \
                -o wide

              echo ""

              echo "========== PREVIEW SERVICE =========="

              kubectl get svc \
                automobile-ai-agent-preview \
                -n automobile-ai \
                -o yaml

              echo ""

              echo "========== PREVIEW ENDPOINTS =========="

              kubectl get endpoints \
                automobile-ai-agent-preview \
                -n automobile-ai \
                -o wide

            displayName: 'Verify Preview'


          # ==================================================
          # PREVIEW SMOKE TEST
          # ==================================================

          - script: |

              set -e

              POD="automobile-ai-preview-test"
              NAMESPACE="automobile-ai"

              echo "Running Preview smoke test..."

              kubectl delete pod "$POD" \
                -n "$NAMESPACE" \
                --ignore-not-found=true

              kubectl run "$POD" \
                -n "$NAMESPACE" \
                --restart=Never \
                --image=curlimages/curl:8.10.1 \
                --command \
                -- sh -c '
                  set -e

                  echo "Testing Preview Service..."

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --max-time 15 \
                    http://automobile-ai-agent-preview:8000/

                  echo ""
                  echo "Preview smoke test PASSED"
                '

              echo "Waiting for smoke-test pod..."

              if kubectl wait \
                --for=jsonpath='{.status.phase}'=Succeeded \
                pod/"$POD" \
                -n "$NAMESPACE" \
                --timeout=90s; then

                echo "Smoke test succeeded."

                kubectl logs \
                  "$POD" \
                  -n "$NAMESPACE"

              else

                echo "Smoke test FAILED."

                kubectl get pod "$POD" \
                  -n "$NAMESPACE" \
                  -o wide

                echo ""
                echo "========== POD LOGS =========="

                kubectl logs \
                  "$POD" \
                  -n "$NAMESPACE" \
                  || true

                echo ""
                echo "========== POD DESCRIPTION =========="

                kubectl describe pod "$POD" \
                  -n "$NAMESPACE" \
                  || true

                exit 1

              fi

              kubectl delete pod "$POD" \
                -n "$NAMESPACE" \
                --ignore-not-found=true

            displayName: 'Smoke test Preview'


          # ==================================================
          # PROMOTE PREVIEW -> ACTIVE
          # ==================================================

          - script: |

              set -e

              echo "=========================================="
              echo "Promoting Preview -> Active"
              echo "=========================================="

              kubectl argo rollouts promote \
                automobile-ai-agent \
                -n automobile-ai

              echo "Promotion command completed."

            displayName: 'Promote Preview to Active'


          # ==================================================
          # VERIFY PROMOTION
          # ==================================================

          - script: |

              set -e

              echo "=========================================="
              echo "VERIFYING PROMOTION"
              echo "=========================================="

              ACTIVE_SELECTOR=$(kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.status.blueGreen.activeSelector}')

              SERVICE_SELECTOR=$(kubectl get service \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.spec.selector.rollouts-pod-template-hash}')

              echo "Rollout Active Selector : $ACTIVE_SELECTOR"
              echo "Service Selector        : $SERVICE_SELECTOR"

              if [ -z "$ACTIVE_SELECTOR" ]; then
                echo "ERROR: Active selector is empty."
                exit 1
              fi

              if [ "$ACTIVE_SELECTOR" != "$SERVICE_SELECTOR" ]; then

                echo "ERROR: Active Service is NOT pointing to Active ReplicaSet."

                echo ""
                echo "Rollout:"
                kubectl argo rollouts get rollout \
                  automobile-ai-agent \
                  -n automobile-ai

                echo ""
                echo "Service:"
                kubectl get service \
                  automobile-ai-agent \
                  -n automobile-ai \
                  -o yaml

                exit 1

              fi

              echo ""
              echo "Active Service successfully switched."

            displayName: 'Verify Promotion'


          # ==================================================
          # VERIFY ACTIVE PODS
          # ==================================================

          - script: |

              set -e

              ACTIVE_SELECTOR=$(kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.status.blueGreen.activeSelector}')

              echo "Active selector: $ACTIVE_SELECTOR"

              kubectl get pods \
                -n automobile-ai \
                -l rollouts-pod-template-hash="$ACTIVE_SELECTOR" \
                -o wide

              READY=$(kubectl get pods \
                -n automobile-ai \
                -l rollouts-pod-template-hash="$ACTIVE_SELECTOR" \
                -o jsonpath='{range .items[*]}{.status.containerStatuses[0].ready}{"\n"}{end}' \
                | grep -c '^true$' || true)

              echo "Ready active pods: $READY"

              if [ "$READY" -lt 2 ]; then
                echo "ERROR: Active pods are not healthy."
                exit 1
              fi

              echo "Active pods are healthy."

            displayName: 'Verify Active Pods'


          # ==================================================
          # FINAL VERIFICATION
          # ==================================================

          - script: |

              set -e

              echo "=========================================="
              echo "FINAL ROLLOUT"
              echo "=========================================="

              kubectl argo rollouts get rollout \
                automobile-ai-agent \
                -n automobile-ai

              echo ""

              echo "=========================================="
              echo "SERVICES"
              echo "=========================================="

              kubectl get svc \
                -n automobile-ai

              echo ""

              echo "=========================================="
              echo "ACTIVE SERVICE SELECTOR"
              echo "=========================================="

              kubectl get service \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.spec.selector}'

              echo ""

              echo "=========================================="
              echo "ACTIVE PODS"
              echo "=========================================="

              ACTIVE_SELECTOR=$(kubectl get rollout \
                automobile-ai-agent \
                -n automobile-ai \
                -o jsonpath='{.status.blueGreen.activeSelector}')

              kubectl get pods \
                -n automobile-ai \
                -l rollouts-pod-template-hash="$ACTIVE_SELECTOR" \
                -o wide

              echo ""

              echo "=========================================="
              echo "BLUE-GREEN DEPLOYMENT SUCCESSFUL"
              echo "=========================================="

            displayName: 'Final deployment verification'
